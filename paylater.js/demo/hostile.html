<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hostile Demo</title>
    <style>
      * { box-sizing: content-box; }
      p { color: red !important; font-size: 40px; font-family: cursive; }
    </style>
  </head>
  <body>
    <article class="product">
      <img src="https://placehold.co/300x200" alt="Wireless Headphones" />
      <h2>Wireless Headphones</h2>
      <p class="Price" data-paylater-amount="129.99">$129.99</p>
      <button>Add to cart</button>
    </article>

    <article class="product">
      <img src="https://placehold.co/300x200" alt="Game Controllers" />
      <h2>Game Controllers</h2>
      <p class="Price" data-paylater-amount="49.50">$49.50</p>
      <button>Add to cart</button>
    </article>

    <article class="product">
      <img src="https://placehold.co/300x200" alt="Smart Watch" />
      <h2>Smart Watch</h2>
      <p class="Price" data-paylater-amount="499.00">$499.00</p>
      <button>Add to cart</button>
    </article>

    <script type="module" src="../src/paylater.ts"></script>
</body>
</html>
